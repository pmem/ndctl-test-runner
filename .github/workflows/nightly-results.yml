---
name: nightly results

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: '57 8 * * *'  # 08:57 UTC daily (5 hours after last test)
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      # CI helper scripts live on main; pull just scripts/ so we can open
      # issues and refresh their open/closed status.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _main
          sparse-checkout: scripts

      - name: collect nightly results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TODAY=$(date -u +%Y-%m-%d)

          # File issues only on the first aggregation for today; a manual
          # re-run must not open duplicate issues for the same failures.
          FILE_ISSUES=1
          [[ -f results.md ]] && grep -q "^| $TODAY |" results.md && FILE_ISSUES=0

          # Collected "[#N](url) (open)" links for today's failing branches.
          ISSUE_LINKS_FILE=$(mktemp)

          status_of() {
            local wf=$1 scope=$2
            local run_date conclusion run_id test_conclusion

            read -r run_id conclusion run_date < <(
              gh api "repos/$REPO/actions/workflows/$wf/runs?per_page=1" \
                --jq '.workflow_runs[0] |
                  "\(.id) \(.conclusion // "pending") \(.created_at | split("T")[0])"' \
                | awk '{print $1, $2, $3}'
            )

            [[ "$run_date" != "$TODAY" ]] && { echo "—";      return; }
            [[ "$conclusion" == "pending" ]] && { echo "running"; return; }

            local run_url="https://github.com/$REPO/actions/runs/$run_id"

            if [[ "$conclusion" == "failure" ]]; then
              if [[ "$FILE_ISSUES" == "1" ]]; then
                # Best-effort: fetch the run log so the issue carries a signature.
                local logdir="/tmp/faillog-$run_id" logfile=""
                if gh run download "$run_id" -D "$logdir" 2>/dev/null; then
                  logfile=$(find "$logdir" -name rq_0.log 2>/dev/null | head -1)
                fi
                local title="$scope daily test failure — $TODAY (run $run_id)"
                local issue_url
                issue_url=$(_main/scripts/ci_open_issue.sh \
                  "$REPO" "$title" "$scope" "$TODAY" "$run_url" "$logfile" || echo "")
                rm -rf "$logdir"
                if [[ -n "$issue_url" ]]; then
                  echo "[#${issue_url##*/}]($issue_url) (open)" >> "$ISSUE_LINKS_FILE"
                fi
              fi
              echo "[<span style=\"color:red\">fail</span>]($run_url)"
              return
            fi

            # Check test job conclusion - job name can be "test" or "test / build"
            test_conclusion=$(gh api "repos/$REPO/actions/runs/$run_id/jobs" \
              --jq '[.jobs[] | select(.name | startswith("test"))][0].conclusion // "none"')

            if [[ "$test_conclusion" == "success" ]]; then
              # Download artifacts and count skipped tests
              local skip_count=0
              local artifact_name="${wf%.yml}"
              artifact_name="logs-${artifact_name#nightly-}"

              if gh run download "$run_id" -n "$artifact_name" -D "/tmp/artifact-$run_id" 2>/dev/null; then
                skip_count=$(grep -E "Skipped:[ \t]+[0-9]+" "/tmp/artifact-$run_id/tmp/rq_0.log" 2>/dev/null \
                  | awk '{print $NF}' | head -1)
                rm -rf "/tmp/artifact-$run_id"
              fi

              if [[ -n "$skip_count" ]] && [[ "$skip_count" -gt 0 ]]; then
                echo "[<span style=\"color:green\">pass</span>]($run_url) [$skip_count]"
              else
                echo "[<span style=\"color:green\">pass</span>]($run_url)"
              fi
            elif [[ "$test_conclusion" == "skipped" ]]; then
              echo "—"
            else
              # No test job found - shouldn't happen but treat as skip
              echo "—"
            fi
          }

          CXL_NEXT=$(status_of      "nightly-cxl-next.yml"        "cxl/next")
          CXL_FIXES=$(status_of     "nightly-cxl-fixes.yml"       "cxl/fixes")
          FOR_NEXT=$(status_of      "nightly-nvdimm-for-next.yml" "nvdimm/for-next")
          NVDIMM_FIXES=$(status_of  "nightly-nvdimm-fixes.yml"    "nvdimm/fixes")
          LINUX_NEXT=$(status_of    "nightly-linux-next.yml"      "linux-next")

          # Any issues opened above (one per failing branch) share the row's
          # single Issues cell, space-separated.
          ISSUES_CELL=" "
          if [[ -s "$ISSUE_LINKS_FILE" ]]; then
            ISSUES_CELL=" $(paste -sd' ' "$ISSUE_LINKS_FILE") "
          fi
          rm -f "$ISSUE_LINKS_FILE"

          NEW_ROW="| $TODAY | $CXL_NEXT | $CXL_FIXES | $FOR_NEXT | $NVDIMM_FIXES | $LINUX_NEXT |$ISSUES_CELL|"

          if [[ ! -f results.md ]]; then
            {
              echo '# Daily Run Results'
              echo ''
              echo 'Tests are run against the [ndctl pending branch](https://github.com/pmem/ndctl/tree/pending).'
              echo ''
              echo '- **[cxl/next](https://git.kernel.org/pub/scm/linux/kernel/git/cxl/cxl.git/log/?h=next)**:		CXL unit tests'
              echo '- **[cxl/fixes](https://git.kernel.org/pub/scm/linux/kernel/git/cxl/cxl.git/log/?h=fixes)**:		CXL unit tests'
              echo '- **[nvdimm/for-next](https://git.kernel.org/pub/scm/linux/kernel/git/nvdimm/nvdimm.git/log/?h=for-next)**:	NVDIMM, DAX unit tests'
              echo '- **[nvdimm/fixes](https://git.kernel.org/pub/scm/linux/kernel/git/nvdimm/nvdimm.git/log/?h=fixes)**:		NVDIMM, DAX unit tests'
              echo '- **[linux-next](https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git/log/?h=master)**:		CXL, NVDIMM, DAX unit tests (all)'
              echo ''
              echo 'Click through on the pass/fail results to lookup the kernel and ndctl SHA under test.'
              echo ''
              echo '| Date | cxl/next | cxl/fixes | nvdimm/for-next | nvdimm/fixes | linux-next | Issues |'
              echo '|------|:--------:|:---------:|:---------------:|:------------:|:----------:|-------|'
            } > results.md
          fi

          # Insert new row at the top of the Daily Branch Results table
          # (after the second |---| separator, which is in the Unit Tests header row)
          python3 - "$NEW_ROW" << 'PYEOF'
          import sys

          new_row = sys.argv[1]
          with open('results.md', 'r') as f:
              lines = f.readlines()

          # Find the Daily Branch Results section, then find the Unit Tests header separator
          in_daily_section = False
          separator_count = 0
          for i, line in enumerate(lines):
              if '## Daily Branch Results' in line:
                  in_daily_section = True
              if in_daily_section and line.startswith('|---'):
                  separator_count += 1
                  # Insert after the second separator (Unit Tests row)
                  if separator_count == 2:
                      lines.insert(i + 1, new_row + '\n')
                      break

          with open('results.md', 'w') as f:
              f.writelines(lines)
          PYEOF

      - name: refresh issue open/closed status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Bake any open->closed transitions into the committed file so the
          # status word is correct even with JavaScript disabled.
          _main/scripts/ci_refresh_issue_status.sh "${{ github.repository }}" results.md

      - name: commit results to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.md
          git diff --cached --quiet || \
            git commit -m "results: $(date -u +%Y-%m-%d)" && git push origin gh-pages
