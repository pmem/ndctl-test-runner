---
name: nightly results

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: '0 4 * * *'  # 3 hours after nightly runs
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: collect nightly results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TODAY=$(date -u +%Y-%m-%d)

          status_of() {
            local wf=$1
            local run_date conclusion run_id test_conclusion

            read -r run_id conclusion run_date < <(
              gh api "repos/$REPO/actions/workflows/$wf/runs?per_page=1" \
                --jq '.workflow_runs[0] |
                  "\(.id) \(.conclusion // "pending") \(.created_at | split("T")[0])"' \
                | awk '{print $1, $2, $3}'
            )

            [[ "$run_date" != "$TODAY" ]] && { echo "—";      return; }
            [[ "$conclusion" == "pending" ]] && { echo "running"; return; }

            local run_url="https://github.com/$REPO/actions/runs/$run_id"

            if [[ "$conclusion" == "failure" ]]; then
              echo "[fail]($run_url)"
              return
            fi

            test_conclusion=$(gh api "repos/$REPO/actions/runs/$run_id/jobs" \
              --jq '[.jobs[] | select(.name == "test")][0].conclusion // "skipped"')

            if [[ "$test_conclusion" == '"skipped"' ]]; then
              echo "skip"
            else
              echo "[pass]($run_url)"
            fi
          }

          CXL_NEXT=$(status_of      "nightly-cxl-next.yml")
          CXL_FIXES=$(status_of     "nightly-cxl-fixes.yml")
          FOR_NEXT=$(status_of      "nightly-nvdimm-for-next.yml")
          NVDIMM_FIXES=$(status_of  "nightly-nvdimm-fixes.yml")
          LINUX_NEXT=$(status_of    "nightly-linux-next.yml")

          NEW_ROW="| $TODAY | $CXL_NEXT | $CXL_FIXES | $FOR_NEXT | $NVDIMM_FIXES | $LINUX_NEXT |"

          if [[ ! -f results.md ]]; then
            {
              echo '# NDCTL Test Runner — Nightly Results'
              echo ''
              echo '**Legend:** `pass` = unit tests passed • `fail` = unit tests failed OR build failed OR workflow failed • `skip` = branch unchanged since last successful run • `—` = not run today'
              echo ''
              echo '| Date | cxl/next | cxl/fixes | nvdimm/for-next | nvdimm/fixes | linux-next |'
              echo '|------|:--------:|:---------:|:---------------:|:------------:|:----------:|'
            } > results.md
          fi

          # Insert new row at the top of the table (after the |---| separator)
          python3 - "$NEW_ROW" << 'PYEOF'
          import sys

          new_row = sys.argv[1]
          with open('results.md', 'r') as f:
              lines = f.readlines()

          for i, line in enumerate(lines):
              if line.startswith('|---'):
                  lines.insert(i + 1, new_row + '\n')
                  break

          with open('results.md', 'w') as f:
              f.writelines(lines)
          PYEOF

      - name: commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.md
          git diff --cached --quiet || \
            git commit -m "results: $(date -u +%Y-%m-%d)" && git push
