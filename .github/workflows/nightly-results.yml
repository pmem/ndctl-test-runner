---
name: nightly results

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: '0 5 * * *'  # 10 pm PDT (UTC-7) / 9 pm PST (UTC-8), 4 hours after tests
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: collect nightly results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TODAY=$(date -u +%Y-%m-%d)

          status_of() {
            local wf=$1
            local run_date conclusion run_id test_conclusion

            read -r run_id conclusion run_date < <(
              gh api "repos/$REPO/actions/workflows/$wf/runs?per_page=1" \
                --jq '.workflow_runs[0] |
                  "\(.id) \(.conclusion // "pending") \(.created_at | split("T")[0])"' \
                | awk '{print $1, $2, $3}'
            )

            [[ "$run_date" != "$TODAY" ]] && { echo "—";      return; }
            [[ "$conclusion" == "pending" ]] && { echo "running"; return; }

            local run_url="https://github.com/$REPO/actions/runs/$run_id"

            if [[ "$conclusion" == "failure" ]]; then
              echo "[fail]($run_url)"
              return
            fi

            # Check test job conclusion - job name can be "test" or "test / build"
            test_conclusion=$(gh api "repos/$REPO/actions/runs/$run_id/jobs" \
              --jq '[.jobs[] | select(.name | startswith("test"))][0].conclusion // "none"')

            if [[ "$test_conclusion" == "success" ]]; then
              echo "[pass]($run_url)"
            elif [[ "$test_conclusion" == "skipped" ]]; then
              echo "skip"
            else
              # No test job found - shouldn't happen but treat as skip
              echo "skip"
            fi
          }

          CXL_NEXT=$(status_of      "nightly-cxl-next.yml")
          CXL_FIXES=$(status_of     "nightly-cxl-fixes.yml")
          FOR_NEXT=$(status_of      "nightly-nvdimm-for-next.yml")
          NVDIMM_FIXES=$(status_of  "nightly-nvdimm-fixes.yml")
          LINUX_NEXT=$(status_of    "nightly-linux-next.yml")

          NEW_ROW="| $TODAY | $CXL_NEXT | $CXL_FIXES | $FOR_NEXT | $NVDIMM_FIXES | $LINUX_NEXT |"

          if [[ ! -f results.md ]]; then
            {
              echo '# Daily Run Results'
              echo ''
              echo 'Tests are run against the ndctl pending branch.'
              echo ''
              echo '- **cxl/next**: https://git.kernel.org/pub/scm/linux/kernel/git/cxl/cxl.git (cxl tests)'
              echo '- **cxl/fixes**: https://git.kernel.org/pub/scm/linux/kernel/git/cxl/cxl.git (cxl tests)'
              echo '- **nvdimm/for-next**: https://git.kernel.org/pub/scm/linux/kernel/git/nvdimm/nvdimm.git (nvdimm + dax tests)'
              echo '- **nvdimm/fixes**: https://git.kernel.org/pub/scm/linux/kernel/git/nvdimm/nvdimm.git (nvdimm + dax tests)'
              echo '- **linux-next**: https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git (cxl + nvdimm + dax tests)'
              echo ''
              echo 'Click through on the pass/fail results to lookup the kernel and ndctl SHA under test.'
              echo ''
              echo '| Date | cxl/next | cxl/fixes | nvdimm/for-next | nvdimm/fixes | linux-next |'
              echo '|------|:--------:|:---------:|:---------------:|:------------:|:----------:|'
            } > results.md
          fi

          # Insert new row at the top of the table (after the |---| separator)
          # and add legend if missing
          python3 - "$NEW_ROW" << 'PYEOF'
          import sys

          new_row = sys.argv[1]
          with open('results.md', 'r') as f:
              lines = f.readlines()

          # Insert new row after table header separator
          for i, line in enumerate(lines):
              if line.startswith('|---'):
                  lines.insert(i + 1, new_row + '\n')
                  break

          # Add legend after table if not present
          has_legend = any('**Legend:**' in line for line in lines)
          if not has_legend:
              legend = [
                  '\n',
                  '**Legend:**\n',
                  '- `pass` = unit tests passed\n',
                  '- `fail` = unit tests failed OR build failed OR workflow failed\n',
                  '- `skip` = both kernel and ndctl branches were unchanged since last successful run\n',
                  '- `—` = not run today\n'
              ]
              # Find last table row and insert legend after
              for i in range(len(lines) - 1, -1, -1):
                  if lines[i].startswith('|') and not lines[i].startswith('|---'):
                      lines[i+1:i+1] = legend
                      break

          with open('results.md', 'w') as f:
              f.writelines(lines)
          PYEOF

      - name: commit results to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.md
          git diff --cached --quiet || \
            git commit -m "results: $(date -u +%Y-%m-%d)" && git push origin gh-pages
